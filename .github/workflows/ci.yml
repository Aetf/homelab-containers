# Build-validate targets on PR / push. This only proves "the image still
# builds" - deploys stay manual (`just deploy <target>`), which carry their
# own validate-then-swap + health-check-with-rollback logic.
#
# otbr is intentionally NOT built here: it compiles ot-br-posix from source
# at upstream HEAD (not a pin), which takes hours under qemu-armv6 and can
# break on upstream churn unrelated to this repo. It is validated at deploy
# time by `just deploy otbr`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Renovate rebases push in quick succession; don't stack stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ github.event_name == 'workflow_dispatch' && steps.all.outputs.targets || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: all
        if: github.event_name == 'workflow_dispatch'
        run: echo 'targets=["adguard","caddy","zerotier","rpi-host"]' >> "$GITHUB_OUTPUT"
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            adguard:
              - 'adguard/**'
              - 'shared/**'
              - 'versions.env'
              - '.github/workflows/ci.yml'
            caddy:
              - 'caddy/**'
              - 'shared/**'
              - 'versions.env'
              - '.github/workflows/ci.yml'
            zerotier:
              - 'zerotier/**'
              - 'shared/**'
              - 'versions.env'
              - '.github/workflows/ci.yml'
            rpi-host:
              # rpi-host builds with --build-context otbr=../otbr
              - 'rpi-host/**'
              - 'otbr/**'
              - 'versions.env'
              - '.github/workflows/ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.targets != '[]' && needs.changes.outputs.targets != ''
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
    # Native arm64 runners (free for public repos): adguard/caddy build
    # natively, rpi-host (armv6) goes through qemu-user-static binfmt.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends just podman
      # NOT apt's qemu-user-static: Ubuntu 24.04's qemu 8.2 hangs emulating
      # 32-bit arm here (rpi-host sat 45min in `apk add`; the same no-cache
      # build takes 26s under qemu 10). Known issue class, see e.g.
      # docker/build-push-action#1071; tonistiigi/binfmt ships a current qemu.
      - name: Register qemu binfmt (armv6)
        if: matrix.target == 'rpi-host'
        run: docker run --privileged --rm docker.io/tonistiigi/binfmt --install arm
      - name: Build ${{ matrix.target }}
        run: just build ${{ matrix.target }}

  renovate-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict
