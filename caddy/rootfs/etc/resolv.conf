# Static (no DHCP anymore): public resolvers, deliberately not the estate's
# own AdGuardHome instances. This container is the reverse proxy standing in
# front of them, so resolving through them would make its own startup and
# certificate renewals depend on what it fronts — including while whole-house
# DNS is down or mid-restart. The ACME DNS-01 challenge reaches the Cloudflare
# API by name and has to keep working across exactly those windows. Only
# affects libc/Go OS-resolver lookups inside the container.
#
# Both families, because the container is dual-stack and its IPv6 address is
# the static one (SLAAC token): resolution should survive an IPv4 outage.
nameserver 9.9.9.9
nameserver 1.1.1.1
nameserver 2620:fe::fe
nameserver 2606:4700:4700::1111
