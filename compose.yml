# Podman Compose specification for OpenThread Border Router (OTBR)
#
# This configuration is based on the official OpenThread guide and includes
# modifications for a custom-built image and host DBus integration for Avahi.
#
# To run:
#   podman-compose up -d
#
# To stop:
#   podman-compose down

version: "3.8"
x-common-labels:
  default-service: &default-service
    restart: unless-stopped
    env_file:
    - otbr.env
    logging:
      driver: k8s-file
      options:
        max-size: 10mb
services:
  otbr:
    <<: *default-service
    # Use the locally built ARMv6 image as requested.
    image: otbr-armv6
    # The container name for easy identification.
    container_name: otbr
    # For some reason, NET_ADMIN is not enough for ip
    # Use the host's network stack. This is required for the OTBR to
    # manage network interfaces and routing correctly.
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BROADCAST
    # Set required kernel parameters for IPv6 and forwarding.
    # This is not compatible with host networking.
    # sysctls:
    #   net.ipv6.conf.eth0.accept_ra: 2
    #   net.ipv6.conf.eth0.accept_ra_rt_info_max_plen: 64
    #   net.ipv6.conf.all.forwarding: 1
    #   net.ipv6.ip_forward: 1
    devices:
      # Maps the host's /dev/ttyACM0 device into the container. This is
      # typically the serial port connected to the Thread Radio Co-Processor
      # (RCP).
      - "/dev/ttyUSB0:/dev/ttyUSB0"
      # Maps the host's /dev/net/tun device into the container. This is
      # necessary for creating and using virtual network interfaces, which are
      # used by OTBR.
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      # Mount the host's DBus socket. This is required for the OTBR service
      # to communicate with the host's Avahi daemon for mDNS discovery.
      - "/var/run/dbus:/var/run/dbus"
      # Mounts the host directory /var/lib/otbr into the container at /data.
      # This allows the container to persist data, such as network
      # configuration, even when the container is stopped or restarted.
      - "/var/lib/otbr:/data"
    logging:
      options:
        path: /var/log/otbr.log
